name: PR Checks

on:
  pull_request:
  merge_group:
    branches: [main]
  workflow_call:
    inputs:
      upload_pages_artifact:
        description: Upload the validated static export for a main deployment
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run linting
        run: npm run lint

      - name: Validate contribution frontmatter
        run: npm run validate:data

      - name: Lint markdown
        run: npm run lint:md

      - name: Build project
        run: npm run build

      - name: Upload GitHub Pages artifact
        if: inputs.upload_pages_artifact && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: out
